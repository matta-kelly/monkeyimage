---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# published to ghcr.io/matta-kelly/monkeyimage
name: monkeyimage
description: My Fedora Sway Atomic image.

# official Fedora Sway Atomic, pinned to a release: docs/monkeyimage.md says why
base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 44

# build stages: their output is copied into the image, their build tools are not
stages:
  - name: keyd # not in Fedora: built from the pinned upstream release. Bump: the version and the sha256 together
    from: fedora:44
    modules:
      - type: script
        snippets:
          - dnf install -y gcc make tar gzip
          - curl -fsSLo /tmp/keyd.tar.gz https://github.com/rvaiya/keyd/archive/refs/tags/v2.6.0.tar.gz
          - echo "697089681915b89d9e98caf93d870dbd4abce768af8a647d54650a6a90744e26  /tmp/keyd.tar.gz" | sha256sum -c - # a mismatch fails the build
          - mkdir -p /tmp/keyd && tar -xzf /tmp/keyd.tar.gz -C /tmp/keyd --strip-components=1 # fixed dir: the version is only in the URL
          - make -C /tmp/keyd
          - make -C /tmp/keyd install PREFIX=/usr DESTDIR=/out FORCE_SYSTEMD=1 # /usr, not /usr/local: /usr/local is machine state on Atomic

  - name: pi # the pi agent: not pinned. Each build takes pi's latest release, so the daily build keeps it current
    from: fedora:44
    modules:
      - type: script
        snippets:
          - curl -fsSLo /tmp/pi-linux-x64.tar.gz https://github.com/earendil-works/pi/releases/latest/download/pi-linux-x64.tar.gz
          - curl -fsSLo /tmp/SHA256SUMS https://github.com/earendil-works/pi/releases/latest/download/SHA256SUMS
          - cd /tmp && grep ' pi-linux-x64.tar.gz$' SHA256SUMS | sha256sum -c - # checked against the release's own sums: a corrupt download, or a release made between the two downloads, fails the build
          - mkdir -p /out/usr/lib/pi /out/usr/bin && tar -xzf /tmp/pi-linux-x64.tar.gz -C /out/usr/lib/pi --strip-components=1 && ln -s ../lib/pi/pi /out/usr/bin/pi # one binary and the files it reads beside it

  - name: llama-cpp # llama-server for monke help's local model: llama.cpp's own CPU build. Fedora's package pulls the AMD GPU stack (1.3 GB). Pinned: llama.cpp releases many times a day. Bump: the build number and the sha256 together
    from: fedora:44
    modules:
      - type: script
        snippets:
          - curl -fsSLo /tmp/llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b12078/llama-b12078-bin-ubuntu-x64.tar.gz
          - echo "600059b6d20ece89e19a20c4e9ab8d23c54cc33e9132a692dffbcc10ed226003  /tmp/llama.tar.gz" | sha256sum -c - # a mismatch fails the build
          - mkdir -p /out/usr/lib/llama.cpp /out/usr/bin && tar -xzf /tmp/llama.tar.gz -C /out/usr/lib/llama.cpp --strip-components=1 && ln -s ../lib/llama.cpp/llama-server /out/usr/bin/llama-server # the binaries find their libraries beside them

  - name: monke # the monke CLI: not pinned. Each build takes monke's latest release, checked against its SHA256SUMS
    from: fedora:44
    modules:
      - type: script
        snippets:
          - curl -fsSLo /tmp/monke.tar.gz https://github.com/matta-kelly/monke/releases/latest/download/monke.tar.gz
          - curl -fsSLo /tmp/SHA256SUMS https://github.com/matta-kelly/monke/releases/latest/download/SHA256SUMS
          - cd /tmp && grep ' monke.tar.gz$' SHA256SUMS | sha256sum -c -
          - mkdir -p /out && tar -xzf /tmp/monke.tar.gz -C /out # its files at their paths under /

# modules run in order
modules:
  - type: files
    files:
      - source: system
        destination: / # files/system/* goes to / in the image

  - type: dnf # added packages, all from the Fedora repos: docs/monkeyimage.md says why each
    install:
      packages:
        # system
        - git # Bootstrap clones the dotfiles with it
        - chezmoi # Bootstrap applies each user's dotfiles with it
        - rbw # Bitwarden CLI with an agent: the personal path reads Vaultwarden through it
        - gh # GitHub CLI: login, and git's credential helper
        - restic # each user's nightly backup
        - htop # rescue kit: slow, hot, full
        - lm_sensors
        - ncdu
        - tailscale
        - distrobox
        - just
        - smartmontools
        - pam-u2f
        - pamu2fcfg
        - yubikey-manager
        # session
        - wf-recorder
        - heif-pixbuf-loader
        - ffmpegthumbnailer

  - type: copy # the docs: how this machine works, readable on it
    src: docs/
    dest: /usr/share/doc/monkeyworks/

  - type: copy # keyd's files from the keyd stage
    from: keyd
    src: /out/
    dest: /

  - type: copy # pi from the pi stage: /usr/lib/pi, and /usr/bin/pi
    from: pi
    src: /out/
    dest: /

  - type: copy # llama-server from the llama-cpp stage: /usr/lib/llama.cpp, and /usr/bin/llama-server
    from: llama-cpp
    src: /out/
    dest: /

  - type: copy # monke from the monke stage: /usr/bin/monke, its model download service, prompts and /etc/monke/config
    from: monke
    src: /out/
    dest: /

  - type: default-flatpaks # installed at boot, from Flathub
    configurations:
      - scope: system # the "both" list: every user gets these
        install:
          - com.github.tchx84.Flatseal
          - com.google.Chrome
          - com.spotify.Client

  - type: systemd
    system:
      enabled:
        - rpm-ostreed-automatic.timer # daily download and stage, with the policy in /etc/rpm-ostreed.conf
        - keyd.service # with no config, keyd matches no keyboard and does nothing
        - tailscaled.service # joins nothing until `tailscale up`
        - monke-model.service # downloads monke help's local model on the first boot that is online, then does nothing
    user:
      enabled:
        - battery-warn.timer # every user, in the graphical session: warns at 20% and 10%
        - wlsunset.service # every user, in the graphical session: warm from 20:00 to 07:00
        - kanshi.service # Fedora's unit; runs only for a user with ~/.config/kanshi/config
        - restic-backup.timer # runs only for a user with ~/.config/restic/env and a password file
        - restic-prune.timer # the same

  - type: signing # policy and keys, so machines can check the image is signed
