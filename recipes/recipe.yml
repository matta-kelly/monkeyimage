---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# published to ghcr.io/matta-kelly/monkeyimage
name: monkeyimage
description: My Fedora Sway Atomic image.

# official Fedora Sway Atomic, pinned to a release: monkeyimage.md says why
base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 45

# modules run in order
modules:
  - type: files
    files:
      - source: system
        destination: / # files/system/* goes to / in the image

  - type: signing # policy and keys, so machines can check the image is signed
