---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# published to ghcr.io/matta-kelly/monkeyimage
name: monkeyimage
description: My Fedora Sway Atomic image.

# official Fedora Sway Atomic, pinned to a release: monkeyimage.md says why
base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 44

# build stages: their output is copied into the image, their build tools are not
stages:
  - name: keyd # not in Fedora: built from the pinned upstream release. Bump: the version and the sha256 together
    from: fedora:44
    modules:
      - type: script
        snippets:
          - dnf install -y gcc make tar gzip
          - curl -fsSLo /tmp/keyd.tar.gz https://github.com/rvaiya/keyd/archive/refs/tags/v2.6.0.tar.gz
          - echo "697089681915b89d9e98caf93d870dbd4abce768af8a647d54650a6a90744e26  /tmp/keyd.tar.gz" | sha256sum -c - # a mismatch fails the build
          - mkdir -p /tmp/keyd && tar -xzf /tmp/keyd.tar.gz -C /tmp/keyd --strip-components=1 # fixed dir: the version is only in the URL
          - make -C /tmp/keyd
          - make -C /tmp/keyd install PREFIX=/usr DESTDIR=/out FORCE_SYSTEMD=1 # /usr, not /usr/local: /usr/local is machine state on Atomic

# modules run in order
modules:
  - type: files
    files:
      - source: system
        destination: / # files/system/* goes to / in the image

  - type: dnf # added packages, all from the Fedora repos: monkeyimage.md says why each
    install:
      packages:
        # system
        - git # Bootstrap clones the dotfiles with it
        - chezmoi # Bootstrap applies each user's dotfiles with it
        - htop # rescue kit: slow, hot, full
        - lm_sensors
        - ncdu
        - tailscale
        - distrobox
        - just
        - smartmontools
        - pam-u2f
        - pamu2fcfg
        - yubikey-manager
        # session
        - wf-recorder
        - heif-pixbuf-loader
        - ffmpegthumbnailer

  - type: copy # keyd's files from the keyd stage
    from: keyd
    src: /out/
    dest: /

  - type: default-flatpaks # installed at boot, from Flathub
    configurations:
      - scope: system # the "both" list: every user gets these
        install:
          - com.github.tchx84.Flatseal

  - type: systemd
    system:
      enabled:
        - rpm-ostreed-automatic.timer # daily download and stage, with the policy in /etc/rpm-ostreed.conf
        - keyd.service # with no config, keyd matches no keyboard and does nothing
    user:
      enabled:
        - battery-warn.timer # every user, in the graphical session: warns at 20% and 10%

  - type: signing # policy and keys, so machines can check the image is signed
